name: Automate Titanic Preprocessing

on:
  push:
    branches: [main]
    paths:
      - 'data_titanic_raw/**'
      - 'preprocessing/automate_Eliv-Kurniawan.py'
      - '.github/workflows/preprocessing.yml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Jalankan otomatis tiap hari jam 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing pipeline
        run: |
          python preprocessing/automate_Eliv-Kurniawan.py \
            --input data_titanic_raw/train.csv \
            --output-dir preprocessing/dataset_preprocessing

      - name: Show generated files
        run: |
          ls -la preprocessing/dataset_preprocessing
          echo "--- titanic_clean.csv (head) ---"
          head -n 5 preprocessing/dataset_preprocessing/titanic_clean.csv

      - name: Upload processed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanic-preprocessed-dataset
          path: preprocessing/dataset_preprocessing/
          retention-days: 30

      - name: Commit & push processed dataset
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preprocessing/dataset_preprocessing/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update preprocessed dataset [skip ci]"
            git push
          fi
